name: Discover New APIs

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 3 AM UTC
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Discover catalog APIs and update configuration
      run: |
        equinix-docs-mcp-server --discover-apis --write | tee discovery-report.txt

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        add-paths: src/equinix_docs_mcp_server/data/config/apis.yaml
        commit-message: "feat(specs): add newly discovered Equinix API specs"
        title: "Add newly discovered Equinix API specs"
        body: |
          Automated scan of [docs.equinix.com/api-catalog](https://docs.equinix.com/api-catalog)
          found API specs that are not yet in the packaged configuration.

          New entries default to `client_credentials` auth. Review each one:
          - Confirm the auth type
          - Add an overlay if the spec needs normalization
          - Add `include`/`exclude` filters only if curation is wanted; the
            searchable tool catalog handles large operation counts

          Auto-generated by the Discover New APIs workflow.
        branch: discover-apis
        delete-branch: true
