name: OpenRPC Docs

# Keeps docs/openrpc (the MCP tool catalog as OpenRPC + an HTML rendering)
# in sync with the server. Pull requests that change the server must commit
# regenerated docs; drift caused only by upstream API spec changes is reported
# without failing the PR and is picked up by the weekly refresh PR.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 4 AM UTC (after Discover New APIs)
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  REDOCLY_CLI_VERSION: '2.54.3'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Generate OpenRPC document and HTML
      run: equinix-docs-mcp-server --log-level ERROR --export-openrpc docs/openrpc

    - name: Lint OpenRPC document
      run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint docs/openrpc/openrpc.json

    - name: Upload generated docs
      uses: actions/upload-artifact@v4
      with:
        name: openrpc-docs
        path: docs/openrpc/

    - name: Check committed docs are current
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if git diff --quiet -- docs/openrpc; then
          echo "✅ docs/openrpc is up to date"
          exit 0
        fi

        {
          echo "### docs/openrpc is out of date"
          echo
          echo '```'
          git diff --stat -- docs/openrpc
          echo '```'
          echo
          echo "Regenerate with: \`equinix-docs-mcp-server --export-openrpc docs/openrpc\`"
          echo "(or download the \`openrpc-docs\` artifact from this run)."
        } >> "$GITHUB_STEP_SUMMARY"

        # Only changes to the server itself must ship regenerated docs.
        if git diff --quiet "origin/${BASE_REF}...HEAD" -- src pyproject.toml; then
          echo "::warning title=OpenRPC docs drift::docs/openrpc differs because upstream API specs changed; the weekly refresh PR will update it."
        else
          echo "::error title=OpenRPC docs out of date::This PR changes the server; regenerate docs/openrpc with 'equinix-docs-mcp-server --export-openrpc docs/openrpc' and commit the result."
          exit 1
        fi

  refresh:
    # Scheduled/manual runs open a PR with regenerated docs.
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Download generated docs
      uses: actions/download-artifact@v4
      with:
        name: openrpc-docs
        path: docs/openrpc/

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        add-paths: docs/openrpc
        commit-message: "docs(openrpc): regenerate MCP tool catalog"
        title: "Regenerate OpenRPC tool catalog docs"
        body: |
          The MCP tool catalog changed, most likely because upstream Equinix
          API specs were updated. This PR refreshes `docs/openrpc/openrpc.json`
          and its HTML rendering.

          Auto-generated by the OpenRPC Docs workflow.
        branch: openrpc-docs
        delete-branch: true
