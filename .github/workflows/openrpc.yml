name: OpenRPC Docs

# Builds the MCP tool catalog (OpenRPC document + HTML rendering) and
# publishes it on GitHub Pages. Pull requests build and lint the site and
# upload it as an artifact without deploying. Pushes to main, the weekly
# schedule (which picks up upstream API spec changes) and manual runs also
# deploy it. The generated files are not committed.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 4 AM UTC (after Discover New APIs)
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  REDOCLY_CLI_VERSION: '2.54.3'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Generate OpenRPC document and HTML
      run: equinix-docs-mcp-server --log-level ERROR --export-openrpc site

    - name: Lint OpenRPC document
      run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint site/openrpc.json

    - name: Upload site artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: openrpc-docs
        path: site/

    - name: Configure Pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
