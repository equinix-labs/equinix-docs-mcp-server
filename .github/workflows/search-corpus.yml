name: Refresh Search Corpus

# Regenerates tests/fixtures/search_corpus.json from the published API specs
# and opens a PR when it changed, so upstream spec changes that move
# search_tools ranking show up in review (see issue #71). The ranking test
# runs here and its results go in the PR body: PRs opened with GITHUB_TOKEN
# don't trigger the CI workflow.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 5 AM UTC (after Discover New APIs and OpenRPC Docs)
    - cron: '0 5 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Regenerate the search corpus
      run: python scripts/export_search_corpus.py --refresh

    - name: Run the ranking test
      id: ranking
      run: |
        {
          echo "## Ranking"
          echo
          echo '```'
          python tests/test_search_ranking.py
          echo '```'
          echo
          if pytest -q tests/test_search_ranking.py > pytest.txt 2>&1; then
            echo "The ranking test passes."
          else
            echo "**The ranking test fails.** A spec change moved a case below its bound,"
            echo "or a known gap now passes. Update the case or fix the ranking before merging."
            echo
            echo '```'
            tail -n 40 pytest.txt
            echo '```'
          fi
        } > ranking-report.md

    - name: Write the PR body
      run: |
        {
          echo "Weekly refresh of \`tests/fixtures/search_corpus.json\` from the published API specs."
          echo "The diff shows which tool names, titles, descriptions and tags changed upstream."
          echo
          cat ranking-report.md
          echo
          echo "Auto-generated by the Refresh Search Corpus workflow."
        } > pr-body.md

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        add-paths: tests/fixtures/search_corpus.json
        commit-message: "test(search): refresh the search ranking corpus"
        title: "test(search): refresh the search ranking corpus"
        body-path: pr-body.md
        branch: refresh-search-corpus
        delete-branch: true
