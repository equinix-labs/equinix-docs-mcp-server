name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
        
    - name: Lint with ruff
      run: |
        ruff check src tests

    - name: Format check with ruff
      run: |
        ruff format --check src tests
        
    - name: Type check with mypy
      run: |
        mypy src
        
    - name: Test with pytest
      run: |
        pytest tests/ --cov=src --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      continue-on-error: true
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  validate-config:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Validate configuration
      run: |
        python -c "from equinix_docs_mcp_server.config import Config; Config.load()"
        echo "✅ Packaged configuration is valid"

    - name: Test spec fetching (dry run)
      run: |
        # This would test spec fetching without actually running the server
        python -c "
        import asyncio
        from equinix_docs_mcp_server.config import Config
        from equinix_docs_mcp_server.spec_manager import SpecManager

        async def test():
            config = Config.load()
            manager = SpecManager(config)
            for api_name, api in config.apis.items():
                for spec in api.specs:
                    if spec.overlay:
                        overlay = config.resolve_path(spec.overlay)
                        assert overlay.exists(), f'{api_name}: missing overlay {overlay}'
            print('✅ SpecManager initialization successful')

        asyncio.run(test())
        "