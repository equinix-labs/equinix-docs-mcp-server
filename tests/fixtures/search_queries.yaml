# Ranking regression cases for search_tools (see tests/test_search_ranking.py
# and issue #71).
#
# Each case is a query a person might type, the tools that answer it (any one
# of them counts), and `within`: the rank the best of them must reach. `within`
# records today's ranking, so the test fails when a change makes a case rank
# worse. When a change makes a case rank better, tighten `within` in the same
# PR.
#
# `gap` marks a query the catalog can't answer yet, with the reason. These are
# expected to fail (strict xfail), so a change that fixes one fails the test
# until the `gap` is removed.
#
# `source` is where the case came from: #53 (the first ranking work), #70,
# #21 (family descriptions) or #72 (this test).

