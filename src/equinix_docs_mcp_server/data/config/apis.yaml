# Authentication configuration
auth:
  # Client Credentials flow for most APIs
  client_credentials:
    token_url: "https://api.equinix.com/oauth2/v1/token"

# Documentation configuration
docs:
  sitemap_url: "https://docs.equinix.com/sitemap.xml"
  # Relative cache paths resolve under the user cache directory
  # (override the root with EQUINIX_MCP_CACHE_DIR)
  cache_path: "docs/sitemap_cache.xml"
arazzo:
   specs:
      - config/workflows.yaml

